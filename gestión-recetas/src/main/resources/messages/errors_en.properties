# ===== Messages in English =====

# --- Validation: Category ---
categoria.nombre.notblank=The category name is required
categoria.nombre.size=The category name cannot exceed {max} characters
categoria.descripcion.size=The category description cannot exceed {max} characters

# --- Validation: Ingredient ---
ingrediente.nombre.notblank=The ingredient name is required
ingrediente.nombre.size=The ingredient name cannot exceed {max} characters

# --- Validation: Recipe ---
receta.nombre.notblank=The recipe name is required
receta.nombre.size=The recipe name cannot exceed {max} characters
receta.nombre.duplicado=A recipe with that name already exists
receta.tiempo.notnull=The preparation time is required
receta.dificultad.notnull=The difficulty is required (FACIL, MEDIA or DIFICIL)
receta.categoria.notnull=The category id is required

# --- Validation: ingredient inside a recipe ---
receta.ingrediente.id.notnull=The ingredient id is required
receta.ingrediente.cantidad.positive=The quantity must be greater than zero
receta.ingrediente.unidad.size=The unit cannot exceed {max} characters

# --- 404 errors ---
categoria.noencontrada.titulo=Category not found
categoria.noencontrada.detalle=Category with id {0} was not found
receta.noencontrada.titulo=Recipe not found
receta.noencontrada.detalle=Recipe with id {0} was not found
ingrediente.noencontrado.titulo=Ingredient not found
ingrediente.noencontrado.detalle=Ingredient with id {0} was not found

# --- Business errors ---
receta.tiempo.invalido.titulo=Invalid preparation time
receta.tiempo.invalido.detalle=The preparation time must be greater than zero, but received {0}
receta.ingrediente.duplicado.titulo=Ingredient already added
receta.ingrediente.duplicado.detalle=The ingredient {1} is already part of the recipe {0}

# --- General errors ---
validacion.error.titulo=Validation error
validacion.error.detalle=One or more fields have invalid values
json.ilegible.titulo=Unreadable request
json.ilegible.detalle=The request body is not valid JSON or contains values that are not allowed, for example an unknown difficulty
integridad.error.titulo=Conflict with existing data
integridad.error.detalle=The operation cannot be completed: a record with that name already exists or the resource is being used by other data
